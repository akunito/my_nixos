# deploy-servers.conf — Server inventory for deploy.sh
# Format:
#   Group header:  @GROUP_NAME|ICON
#   Server line:   PROFILE|USER|IPS|DESCRIPTION|COMMAND|SSH_TIMEOUT
#
# Placeholders in COMMAND:
#   {DIR}      — dotfiles directory on remote
#   {PROFILE}  — profile name from the first field
#
# IPs may be comma-separated (first reachable one wins)
# Lines starting with # are comments; blank lines are ignored
#
# NOTE ON `-u`: deliberately absent from akunito's nodes. deploy.sh already does
# `git fetch` + `git reset --hard origin/main`, which lands the flake.lock
# committed from DESK — and `-u` then threw it away by re-running
# `nix flake update` on the target, re-locking every input to whatever upstream
# had at that moment. That gave every node its own nixpkgs, so almost nothing
# matched DESK's store and its harmonia cache served nearly nothing; anything
# absent from cache.nixos.org (flake inputs, overlay-patched packages) got
# compiled locally instead. Without `-u` the fleet follows DESK's lock and
# fetches. Pass `-u` by hand when you deliberately want to bump a node.
#
# The KOMI_LXC_* entries keep `-u`: they sit on another network, cannot reach
# DESK's cache at all, and track the `komi` branch rather than main.

@Komi LXC Containers|󰡨
KOMI_LXC_database|admin|192.168.1.10|PostgreSQL & Redis (Komi)|./install.sh {DIR} {PROFILE} -s -u -d -h|10
KOMI_LXC_mailer|admin|192.168.1.11|Mail & monitoring (Komi)|./install.sh {DIR} {PROFILE} -s -u -d -h|10
KOMI_LXC_monitoring|admin|192.168.1.12|Prometheus & Grafana (Komi)|./install.sh {DIR} {PROFILE} -s -u -d -h|10
KOMI_LXC_proxy|admin|192.168.1.13|Cloudflare & NPM (Komi)|./install.sh {DIR} {PROFILE} -s -u -d -h|10
KOMI_LXC_tailscale|admin|192.168.1.14|Tailscale router (Komi)|./install.sh {DIR} {PROFILE} -s -u -d -h|10

