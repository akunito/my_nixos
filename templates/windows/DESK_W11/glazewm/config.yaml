# GlazeWM for DESK_W11 — the Sway layout on Windows 11: tiling by default,
# floating per window, workspaces bound per monitor (10-19 main, 20-29 secondary,
# same numbers as Sway's swaysome groups). NO keybindings here on purpose: every
# Hyper chord lives in hyper-desktops.ahk and calls `glazewm command ...`, so the
# keyboard layer stays in one place and the Win key stays usable.
# Loaded through the GLAZEWM_CONFIG_PATH user env var -> this file in the Windows
# clone of the repo (C:\Users\<user>\.dotfiles). Apply: Hyper+Shift+R.
general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: true
  toggle_workspace_on_refocus: true      # sway: workspace_auto_back_and_forth yes
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false             # taskbar shows only the visible workspaces, like sway

gaps:
  scale_with_dpi: true
  inner_gap: '4px'
  outer_gap:
    top: '4px'
    right: '4px'
    bottom: '4px'
    left: '4px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#7aa2f7'
    hide_title_bar: { enabled: false }
    corner_style: { enabled: false, style: 'square' }
    transparency: { enabled: false, opacity: '95%' }
  other_windows:
    border:
      enabled: true
      color: '#3b4252'
    hide_title_bar: { enabled: false }
    corner_style: { enabled: false, style: 'square' }
    transparency: { enabled: false, opacity: '0%' }

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: true       # sway: floating windows always above the tiled ones
    fullscreen:
      maximized: false
      shown_on_top: false

# Monitor 0 = primary (2560x1440, left), monitor 1 = the vertical one (right).
# Verify with `glazewm query monitors` after a display change.
workspaces:
  - { name: '11', bind_to_monitor: 0 }
  - { name: '12', bind_to_monitor: 0 }
  - { name: '13', bind_to_monitor: 0 }
  - { name: '14', bind_to_monitor: 0 }
  - { name: '15', bind_to_monitor: 0 }
  - { name: '16', bind_to_monitor: 0 }
  - { name: '17', bind_to_monitor: 0 }
  - { name: '18', bind_to_monitor: 0 }
  - { name: '19', bind_to_monitor: 0 }
  - { name: '10', bind_to_monitor: 0 }
  - { name: '21', bind_to_monitor: 1 }
  - { name: '22', bind_to_monitor: 1 }
  - { name: '23', bind_to_monitor: 1 }
  - { name: '24', bind_to_monitor: 1 }
  - { name: '25', bind_to_monitor: 1 }
  - { name: '26', bind_to_monitor: 1 }
  - { name: '27', bind_to_monitor: 1 }
  - { name: '28', bind_to_monitor: 1 }
  - { name: '29', bind_to_monitor: 1 }
  - { name: '20', bind_to_monitor: 1 }

window_rules:
  # Never managed (overlays, launchers, popups).
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'ShareX' }
      - window_process: { equals: 'AutoHotkey64_UIA' }
  # Always floating (sway's for_window floating enable) — extend as needed.
  - commands: ['set-floating --centered']
    match:
      - window_process: { equals: 'ApplicationFrameHost' }   # UWP host: Calculator lives here
        window_title: { regex: '^(Calculator|Calculadora)$' }
      - window_process: { equals: 'CalculatorApp' }
      - window_process: { equals: 'Bitwarden' }
      - window_process: { equals: 'windhawk' }
      - window_process: { equals: 'Taskmgr' }
      - window_process: { equals: 'ApplicationFrameHost' }
        window_title: { equals: 'Settings' }
  # Sway assigns: vivaldi -> 11, code -> 12, obsidian -> 21.
  - commands: ['move --workspace 11']
    match:
      - window_process: { equals: 'vivaldi' }
  - commands: ['move --workspace 12']
    match:
      - window_process: { equals: 'Code' }
  - commands: ['move --workspace 21']
    match:
      - window_process: { equals: 'Obsidian' }

binding_modes: []
keybindings: []
