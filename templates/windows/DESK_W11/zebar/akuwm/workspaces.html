<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
      body { font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; font-size: 12px; color: #e0def4; }
      #ws { display: flex; align-items: center; gap: 4px; height: 28px; padding-left: 2px; }
      /* Rosé Pine, matched to the Windhawk-styled taskbar: pills #302D47, bar #0A0A0A */
      .ws { border: 0; border-radius: 6px; padding: 2px 9px; line-height: 16px; cursor: pointer;
            background: #302d47; color: #908caa; font-weight: 500; }
      .ws.displayed { background: #c4a7e7; color: #191724; font-weight: 600; }
      .ws.focused { box-shadow: 0 0 0 1px #c4a7e7 inset; }
      .ws:hover { background: #403d52; color: #e0def4; }
      .ws.displayed:hover { background: #d3bff0; color: #191724; }
    </style>
  </head>
  <body>
    <div id="ws"></div>
    <script type="module">
      // Workspaces of the monitor this widget sits on (one widget per monitor).
      const el = document.getElementById('ws');
      const show = (t) => { el.textContent = t; };
      show('…');
      try {
        const zebar = await import('https://esm.sh/zebar@3.0');
        const glazewm = zebar.createProvider({ type: 'glazewm' });
        const win = zebar.currentWidget().tauriWindow;
        // A topmost window over a fullscreen game forces DWM composition (Composed: Flip,
        // measured 2026-09-17), so the pill hides its whole window while the focused
        // window of its monitor is fullscreen or covers the monitor.
        let hidden = false;
        function coversMonitor(o) {
          const f = o.focusedContainer, m = o.currentMonitor;
          if (!f || f.type !== 'window' || !m || o.focusedMonitor?.id !== m.id) return false;
          if (f.state?.type === 'fullscreen') return true;
          return f.x <= m.x && f.y <= m.y && f.x + f.width >= m.x + m.width && f.y + f.height >= m.y + m.height;
        }
        function render() {
          const o = glazewm.output;
          if (!o) { show('no glazewm'); return; }
          const fs = coversMonitor(o);
          if (fs !== hidden) { hidden = fs; (fs ? win.hide() : win.show()).catch(() => {}); }
          el.replaceChildren();
          for (const w of o.currentWorkspaces ?? []) {
            const b = document.createElement('button');
            b.className = 'ws' + (w.isDisplayed ? ' displayed' : '') + (w.hasFocus ? ' focused' : '');
            b.textContent = w.displayName ?? w.name;
            b.onclick = () => glazewm.runCommand(`focus --workspace ${w.name}`);
            el.appendChild(b);
          }
        }
        render();
        glazewm.onOutput(render);
        glazewm.onError?.((e) => show('error: ' + e));
      } catch (e) {
        show('init error: ' + (e && e.message ? e.message : e));
      }
    </script>
  </body>
</html>
