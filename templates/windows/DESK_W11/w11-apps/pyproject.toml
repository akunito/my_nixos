[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "w11-apps"
version = "0.1.0"
description = "Window rules, shortcuts and startup manager for DESK_W11 (GlazeWM + AutoHotkey): CLI + Qt GUI"
requires-python = ">=3.11"
# The CLI has no dependencies on purpose: it runs from WSL (where this repo
# lives) and from Windows with a bare Python. Only the GUI needs PySide6.
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
w11-apps = "w11_apps.cli:main"

[tool.setuptools.packages.find]
include = ["w11_apps*"]
