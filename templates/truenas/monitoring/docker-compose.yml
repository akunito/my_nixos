# Monitoring stack - TrueNAS Docker (ROOTLESS daemon)
# Exports host and container metrics for VPS Prometheus scraping
#
# node-exporter: host metrics via bind-mounted /proc, /sys, /rootfs
# cadvisor: rootless Docker container metrics (root containers have own healthchecks)

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # rslave: host unmounts (e.g. .zfs/snapshot expiry) propagate into the container,
      # so it never pins a snapshot superblock. Without it a later `zfs destroy` hangs
      # and the statfs() automount race panics ZFS (openzfs/zfs#17659, NAS 2026-09-12).
      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind:
          propagation: rslave
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.textfile.directory=/rootfs/var/lib/prometheus-node-exporter/textfile'
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9100/metrics || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      # rslave: host unmounts (e.g. .zfs/snapshot expiry) propagate into the container,
      # so it never pins a snapshot superblock. Without it a later `zfs destroy` hangs
      # and the statfs() automount race panics ZFS (openzfs/zfs#17659, NAS 2026-09-12).
      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind:
          propagation: rslave
      - /run/user/1000:/var/run:ro
      - /sys:/sys:ro
      - /home/akunito/.local/share/docker:/var/lib/docker:ro
    command:
      # Rootless Docker: containerd socket is under the user runtime dir
      - '-containerd=/var/run/docker/containerd/containerd.sock'
      - '-docker_only'
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
