# AkuCraft CREATIVE — Minecraft Fabric 1.21.1, modo creativo, 3 jugadores
# Deploy: /mnt/ssdpool/docker/compose/gameservers/akucraft-creative en NAS_PROD
#
# MUDADO DESDE VPS_PROD el 2026-08-22. El VPS tiene 31 GB y los tres mundos
# declaraban 27 GB de límite: el OOM killer del kernel se llevó 44 procesos
# java en 30 días y la swap estaba al 100%. El NAS tiene 62 GB de los que
# 36,7 son caché ARC de ZFS —reclamable—, así que aquí sobra sitio.
#
# ⚠️ EL NAS DUERME 23:00-16:00 (nas-suspend.timer). El servidor no está
# disponible fuera de esa ventana, y el script de suspensión NO comprueba si
# hay jugadores dentro: a las 23:00 se suspende con vosotros conectados.
# Ver docs/akunito/plans/akucraft-creative-rebuild.md.
#
# Regenerado por completo el 2026-08-22. El creativo anterior se retiró el
# 2026-08-14 y su data/ entero (mundo de 19 MB + los jars de la lista vieja)
# está archivado al lado, no borrado. Había que empezar limpio: los jars de
# la lista anterior seguirían cargándose junto a los nuevos.
#
# Base: la lista de AkuCraft Solo (78) + 4. Es decir, hereda de solo todo lo
# que se quitó por ser de colaboración, IA/NPC, mapa web o red de seguridad
# ante la muerte — en creativo la mitad de eso además no tiene función,
# porque no se pierde nada y no hay escasez.
#
# Los 4 que vuelven de prod, y por qué aquí sí:
#   warputils          /tpa y /warp SON el transporte de un mundo de
#                      construcción compartido. En solo se quitaron porque en
#                      hardcore el viaje de vuelta es la tensión; aquí no hay
#                      tensión que preservar.
#   explorers-compass  en solo mataba el descubrimiento; en creativo es una
#                      herramienta para ir a ver una estructura.
#   multiworld         + icommon (su dependencia). Instalados sin usarse: de
#                      momento hay UN mundo. Están para poder añadir un
#                      segundo más adelante sin tocar la lista de mods.
#
# shadowborders NO está: sólo hace falta cuando quieres bordes DISTINTOS por
# mundo, y con un mundo no hay nada que separar. Es una línea cuando llegue
# ese momento.
#
# El Overworld lo genera Terralith desde el chunk 0, igual que en solo: sin
# multimundo y sin costura. Es la "config de frontier" aplicada directamente
# al mundo principal.
#
# Uso:
#   docker compose up -d       arrancar
#   docker compose logs -f     ver el arranque
#   docker compose down        parar
#   docker exec minecraft-creative rcon-cli list
services:
  minecraft-creative:
    image: itzg/minecraft-server:latest
    container_name: minecraft-creative
    # "no", not unless-stopped: on-demand stack (nasOnDemandDockerProjects). A
    # dockerd restart or a reboot must not bring it back (AINF-401).
    restart: "no"
    # 2m de gracia: el guardado de mundos al parar puede superar los 10s por
    # defecto, y un SIGKILL a media escritura corrompe regiones (pasó el
    # 2026-08-25: exit 137 en el primer stop tras la migración).
    stop_grace_period: 2m
    tty: true
    stdin_open: true
    ports:
      # Sólo la dirección Tailscale del NAS, nunca 0.0.0.0. El host tiene
      # tailscale0 con 100.64.0.1/32, así que se mantiene la misma regla que
      # en el VPS: quien no está en el tailnet no llega.
      - "100.64.0.1:25566:25565"
      # RCON sin publicar: docker exec minecraft-creative rcon-cli
    environment:
      TYPE: "FABRIC"
      VERSION: "1.21.1"
      EULA: "TRUE"

      # === Modo ===
      # FORCE_GAMEMODE sí aquí (al revés que en solo, donde deshacía la muerte
      # permanente): en un servidor de construcción devolver a todo el mundo a
      # creativo al entrar es justo lo que se quiere.
      MODE: "creative"
      FORCE_GAMEMODE: "true"
      # normal, no peaceful: con Terralith y las estructuras el mundo se ve
      # mucho más vivo con mobs. En creativo no te pueden hacer daño de todos
      # modos. Una palabra si prefieres peaceful.
      DIFFICULTY: "normal"

      # === Offline / EasyAuth ===
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"

      # === Rendimiento ===
      MEMORY: "${MC_MEMORY:-6G}"
      USE_AIKAR_FLAGS: "true"

      # === server.properties ===
      SERVER_NAME: "${MC_SERVER_NAME:-AkuCraft Creative}"
      MOTD: "${MC_MOTD:-AkuCraft Creative — construir sin límites}"
      MAX_PLAYERS: "${MC_MAX_PLAYERS:-3}"
      VIEW_DISTANCE: "${MC_VIEW_DISTANCE:-16}"
      SIMULATION_DISTANCE: "${MC_SIMULATION_DISTANCE:-10}"
      SPAWN_PROTECTION: "0"
      ALLOW_FLIGHT: "true"
      ENABLE_COMMAND_BLOCK: "true"
      PVP: "false"
      # SEED sin definir: semilla nueva al crear el mundo.

      # === Whitelist ===
      # Akunito + Snizzy_Chan. data/whitelist.json está escrito A MANO con los
      # UUID OFFLINE -- md5("OfflinePlayer:<Nombre>") con los bits de versión y
      # variante puestos. El de Akunito se contrastó con el usercache de prod.
      #
      # La variable WHITELIST de la imagen se queda SIN poner a propósito:
      # resuelve el nombre contra Mojang y guardaría el UUID *online* de un
      # desconocido que se llame igual. OVERRIDE_WHITELIST queda en false
      # (defecto) para que la imagen no reescriba el fichero.
      #
      # Los nombres distinguen mayúsculas: "snizzy_chan" sería otro jugador.
      # max-players es 3 y hay 2 en la lista: queda sitio para un tercero.
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"

      # === Watchdog ===
      # Desactivado. El watchdog de vanilla mata el servidor cuando un tick
      # pasa de 60 s, asumiendo que se ha colgado. Durante una pregeneración de
      # chunky —una hora de trabajo pesado con NADIE dentro— un tick lento no
      # es un cuelgue, es el trabajo. El 2026-08-22 un tick de 78 s tiró este
      # servidor dos veces mientras la máquina estaba a load 198; chunky
      # reanudó solo gracias a continueOnRestart, así que no se perdió nada,
      # pero cada muerte costó ~70 s de arranque y pudo haber pillado a chunky
      # a media escritura.
      #
      # Sin jugadores que noten el lag, el watchdog sólo tiene inconvenientes.
      MAX_TICK_TIME: "-1"

      # === RCON ===
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${MC_RCON_PASSWORD}"
      RCON_PORT: "25575"

      # === Mods (82) ===
      # Versiones PINNED. Sin pinear se re-resuelven al recrear el contenedor
      # y expulsan a todos los clientes (pasó en prod 2026-08-03).
      # NO pongas comentarios DENTRO del bloque: cada línea es un proyecto.
      MODRINTH_PROJECTS: |
        fabric-api:0.116.15+1.21.1
        lithium:mc1.21.1-0.15.4-fabric
        easyauth:3.4.4
        supplementaries:1.21.1-3.8.2
        moonlight:1.21.1-3.1.1
        skinrestorer:2.10.0+1.21-fabric
        cloth-config:15.0.140+fabric
        fabric-language-kotlin:1.13.13+kotlin.2.4.10
        grind-enchantments:4.0.0+1.21.1
        expanded-armor-enchanting:1.0.9
        expanded-weapon-enchanting:1.1.1
        expanded-axe-enchanting:1.0.11
        expanded-bow-enchanting:1.1.2
        expanded-crossbow-enchanting:1.0.2
        expanded-trident-enchanting:1.0.11
        shield-expansion:1.4.1
        enchanting-infuser:v21.1.4-1.21.1-Fabric
        puzzles-lib:v21.1.52-1.21.1-Fabric
        forge-config-api-port:v21.1.6-1.21.1-Fabric
        polymer:0.9.19+1.21.1
        playeranimator:2.0.4+1.21.1-fabric
        trinkets:3.10.0
        spell-power:1.6.0+1.21.1-fabric
        spell-engine:1.9.16+1.21.1-fabric
        structure-pool-api:1.2.1+1.21.1-fabric
        bundle-api:1.1.0-fabric
        runes:1.3.1+1.21.1-fabric
        azurelib-armor:3.1.3
        wizards:3.0.4+1.21.1-fabric
        paladins-and-priests:3.0.5+1.21.1-fabric
        rogues-and-warriors:3.0.4+1.21.1-fabric
        architectury-api:13.0.11+fabric
        simply-tooltips:0.1.3
        fzzy-config:0.7.6+1.21
        simply-swords:1.63.0-1.21.1
        sswaystones:1.1.3-HOTFIX
        ferrite-core:7.0.3-fabric
        krypton:0.2.8
        cristel-lib:fabric-1.21.1-3.1.7
        towns-and-towers:1.13.11
        when-dungeons-arise:2.1.68
        skills:0.18.3
        attributes:0.8.3
        default-skill-trees:1.1
        artifacts:13.2.1
        geckolib:4.9.2
        cardinal-components-api:6.1.3
        bosses-of-mass-destruction:1.10.2-1.21.1
        automodpack:4.0.6
        yungs-api:1.21.1-Fabric-5.1.6
        yungs-better-dungeons:1.21.1-Fabric-5.1.4
        yungs-better-mineshafts:1.21.1-Fabric-5.1.1
        yungs-better-strongholds:1.21.1-Fabric-5.1.3
        yungs-better-desert-temples:1.21.1-Fabric-4.1.5
        yungs-better-jungle-temples:1.21.1-Fabric-3.1.2
        yungs-better-witch-huts:1.21.1-Fabric-4.1.1
        yungs-better-ocean-monuments:1.21.1-Fabric-4.1.2
        yungs-better-nether-fortresses:1.21.1-Fabric-3.1.5
        structory:1.3.17
        dungeons-and-taverns:v4.4.4+mod
        nullscape:1.2.14
        amplified-nether:1.2.16
        lithostitched:1.7.13-fabric-21.1
        terralith:2.6.2
        doggy-talents-next:t76oZsgc
        naturalist:DwMaTECx
        small-ships:BSRcyUiv
        sound-physics-remastered:tVu2EZ4u
        presence-footsteps:CrvsDgLW
        creativecore:wZEbqU3j
        ambientsounds:wU311vqz
        pets-not-friendly-fire:1.0.2
        travelersbackpack:1.21.1-10.1.38
        toms-storage:1.21-2.4.1-fabric
        storagedrawers:1.21.1-13.11.4
        hybrid-aquatic:1.6.9-fabric
        biolith:3.0.14
        chunky:1.4.23
        warputils:0.5.3
        explorers-compass:1.21.1-2.6.0-fabric
        multiworld:1.13.1
        icommon:108

      TZ: "Europe/Madrid"

    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          # 6G de heap + 3G para off-heap, metaspace y buffers directos, que
          # es la regla que prod documenta y que en el VPS no se podía pagar.
          # Con 62 GB en la máquina, apretar aquí no compra nada.
          memory: 9G
          # 12 núcleos compartidos sólo con el stack de medios, que consume
          # 1,2 GB y va a load 0,5. Más holgado que en el VPS.
          cpus: "8"
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

networks:
  default:
    driver: bridge
