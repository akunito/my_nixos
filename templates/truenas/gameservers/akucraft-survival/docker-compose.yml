# AkuCraft SURVIVAL (prod) — Minecraft Fabric 1.21.1, offline mode + EasyAuth
# Deploy: /mnt/ssdpool/docker/compose/gameservers/akucraft-survival on NAS_PROD
#
# Moved from VPS_PROD (~/.homelab/minecraft) on AINF-401: nobody was playing and
# the VPS should not carry a 57 G world. ON-DEMAND stack: nothing starts it at
# boot or after resume; the AkuCraft Telegram bot (/start, 45-min idle stop) or
# `nas-svc start akucraft-survival` does, and the NAS takes it down before the
# 23:00 suspend. The NAS sleeps 23:00-16:00.
#
# data/automodpack/automodpack-server.json must say "addressToSend": "100.64.0.1"
# or every client is sent to the VPS for the pack and kicked.
#
# .env: MC_RCON_PASSWORD (plus the optional MC_* overrides below).
#
# Post-first-boot:
# 1. Configure EasyAuth: data/config/EasyAuth/config.json
# 2. Configure Flan claims: data/config/flan/
# 3. Players register in-game: /auth register <password>

services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    # "no", not unless-stopped: on-demand stack (nasOnDemandDockerProjects). A
    # dockerd restart or a reboot must not bring it back (AINF-401).
    restart: "no"
    # 2m: the world save on stop outlasts the 10s default and a SIGKILL mid-write
    # corrupts regions (exit 137 on 2026-08-25, creative).
    stop_grace_period: 2m
    tty: true
    stdin_open: true
    ports:
      # Tailnet address of the NAS only, never 0.0.0.0.
      - "100.64.0.1:25565:25565"
      # RCON is not published: docker exec minecraft rcon-cli
    environment:
      # === Server Type ===
      TYPE: "FABRIC"
      VERSION: "1.21.1"
      EULA: "TRUE"

      # === Offline / Cracked Mode (EasyAuth password login) ===
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"

      # === Performance ===
      MEMORY: "${MC_MEMORY:-4G}"
      USE_AIKAR_FLAGS: "true"

      # === Server Properties ===
      SERVER_NAME: "${MC_SERVER_NAME:-AkuCraft}"
      MOTD: "${MC_MOTD:-AkuCraft — Fabric 1.21.1}"
      DIFFICULTY: "${MC_DIFFICULTY:-hard}"
      MAX_PLAYERS: "${MC_MAX_PLAYERS:-10}"
      VIEW_DISTANCE: "${MC_VIEW_DISTANCE:-12}"
      SIMULATION_DISTANCE: "${MC_SIMULATION_DISTANCE:-8}"
      SPAWN_PROTECTION: "0"
      ALLOW_FLIGHT: "true"
      ENABLE_COMMAND_BLOCK: "true"
      PVP: "true"

      # === RCON ===
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${MC_RCON_PASSWORD}"
      RCON_PORT: "25575"

      # === Mods via Modrinth auto-download ===
      # Mods are PINNED - unpinned versions re-resolve on container
      # recreation and kick every client (2026-08-03). cloth-config and
      # fabric-language-kotlin are libraries for the expanded-* mods.
      # grind-enchantments + expanded-* are server-side only: they add no
      # registry entries, so clients need install nothing.
      #
      # Graduated from staging 2026-08-16 after in-game verification:
      #   artifacts       passive treasure gear, found in chests, never crafted
      #   bosses-of-mass-destruction  four optional endgame bosses; structures
      #                   only generate in NEW chunks and their spacing is
      #                   widened in config/cristellib/... so nobody trips over
      #                   one near an existing base
      #   geckolib, cardinal-components-api  their libraries
      #   automodpack     keeps every client's mods in step with this list,
      #                   over the existing game port. Without it a player who
      #                   skips a modpack re-import is kicked with "Received N
      #                   registry entries that are unknown to this client".
      #
      #   yungs-*          replace the vanilla dungeons/mineshafts/strongholds/
      #                    temples/huts/monuments/fortresses in NEW chunks only.
      #                    client_side: unsupported, and they do not touch
      #                    villages, so MCA is unaffected.
      #   structory, dungeons-and-taverns  additive decorative structures
      #   explorers-compass  in-game structure finder, teleports for ops
      #   nullscape        rebuilds the End. It had ZERO generated chunks, so
      #                    there is no seam anywhere.
      #   amplified-nether overrides only worldgen/noise_settings/nether.json.
      #                    The Nether was wiped on 2026-08-16 with the group's
      #                    agreement, so it has no seam either.
      #
      #   chunky           pre-generates the Overworld out to the fence BEFORE
      #                    Terralith arrives. Order matters: a chunk generated
      #                    after Terralith is a seam, and the ring at the fence
      #                    is exactly where players would walk into one.
      # NOTE: do not put comments INSIDE the block below - every line in it is
      # read as a project name.
      MODRINTH_PROJECTS: |
        fabric-api:0.116.15+1.21.1
        lithium:mc1.21.1-0.15.4-fabric
        easyauth:3.4.4
        flan:1.21.1-1.12.7-fabric
        supplementaries:1.21.1-3.8.2
        moonlight:1.21.1-3.1.1
        skinrestorer:2.10.0+1.21-fabric
        cloth-config:15.0.140+fabric
        fabric-language-kotlin:1.13.13+kotlin.2.4.10
        grind-enchantments:4.0.0+1.21.1
        expanded-armor-enchanting:1.0.9
        expanded-weapon-enchanting:1.1.1
        expanded-axe-enchanting:1.0.11
        expanded-bow-enchanting:1.1.2
        expanded-crossbow-enchanting:1.0.2
        expanded-trident-enchanting:1.0.11
        shield-expansion:1.4.1
        enchanting-infuser:v21.1.4-1.21.1-Fabric
        puzzles-lib:v21.1.52-1.21.1-Fabric
        forge-config-api-port:v21.1.6-1.21.1-Fabric
        polymer:0.9.19+1.21.1
        universal-graves:3.4.4+1.21
        ly-soulbound-enchantment:v1.0.6+mod
        collective:1.21.1-8.39-fabric+forge+neo
        playeranimator:2.0.4+1.21.1-fabric
        trinkets:3.10.0
        spell-power:1.6.0+1.21.1-fabric
        spell-engine:1.9.16+1.21.1-fabric
        structure-pool-api:1.2.1+1.21.1-fabric
        bundle-api:1.1.0-fabric
        runes:1.3.1+1.21.1-fabric
        azurelib-armor:3.1.3
        wizards:3.0.4+1.21.1-fabric
        paladins-and-priests:3.0.5+1.21.1-fabric
        rogues-and-warriors:3.0.4+1.21.1-fabric
        architectury-api:13.0.11+fabric
        simply-tooltips:0.1.3
        fzzy-config:0.7.6+1.21
        simply-swords:1.63.0-1.21.1
        sswaystones:1.1.3-HOTFIX
        warputils:0.5.3
        universal-shops:1.7.1+1.21
        luckperms:v5.4.140-fabric
        ferrite-core:7.0.3-fabric
        krypton:0.2.8
        styled-chat:2.6.1+1.21
        cristel-lib:fabric-1.21.1-3.1.7
        towns-and-towers:1.13.11
        when-dungeons-arise:2.1.68
        skills:0.18.3
        attributes:0.8.3
        default-skill-trees:1.1
        minecraft-comes-alive-reborn:7.7.32+1.21.1
        artifacts:13.2.1
        geckolib:4.9.2
        cardinal-components-api:6.1.3
        bosses-of-mass-destruction:1.10.2-1.21.1
        automodpack:4.0.6
        chunky:1.4.23
        yungs-api:1.21.1-Fabric-5.1.6
        yungs-better-dungeons:1.21.1-Fabric-5.1.4
        yungs-better-mineshafts:1.21.1-Fabric-5.1.1
        yungs-better-strongholds:1.21.1-Fabric-5.1.3
        yungs-better-desert-temples:1.21.1-Fabric-4.1.5
        yungs-better-jungle-temples:1.21.1-Fabric-3.1.2
        yungs-better-witch-huts:1.21.1-Fabric-4.1.1
        yungs-better-ocean-monuments:1.21.1-Fabric-4.1.2
        yungs-better-nether-fortresses:1.21.1-Fabric-3.1.5
        structory:1.3.17
        dungeons-and-taverns:v4.4.4+mod
        explorers-compass:1.21.1-2.6.0-fabric
        nullscape:1.2.14
        amplified-nether:1.2.16
        inventory-totem:1.21.1-3.4-fabric+forge+neo
        system-teams:Rvkjp7L2
        chat-plus:O0ucbFxe
        doggy-talents-next:t76oZsgc
        naturalist:DwMaTECx
        respawnable-pets:DxDhy0br
        balm:VynBiUHt
        hardcore-revival:dXThjEfo
        small-ships:BSRcyUiv
        sound-physics-remastered:tVu2EZ4u
        presence-footsteps:CrvsDgLW
        creativecore:wZEbqU3j
        ambientsounds:wU311vqz
        anti-xray:KlJq0gHr
        pets-not-friendly-fire:1.0.2
        travelersbackpack:1.21.1-10.1.38
        lithostitched:1.7.13-fabric-21.1
        terralith:2.6.2
        multiworld:1.13.1
        icommon:108
        shadowborders:0.1
        surveyor:1.2.4+1.21
        toms-storage:1.21-2.4.1-fabric
        storagedrawers:1.21.1-13.11.4
        hybrid-aquatic:1.6.9-fabric
        biolith:3.0.14
        vanish:1.6.15+1.21.1

      # === Timezone ===
      TZ: "Europe/Madrid"

    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          # 8G heap + roughly 1.3G of off-heap, metaspace and direct buffers.
          # Raised from 6G/9G on 2026-08-20 after rubber-banding while exploring
          # fresh Terralith chunks. Keep the cap at heap + ~3G: the heap is
          # pre-touched by Aikar's flags and does not grow, but off-heap can
          # spike, and an OOM kill mid-generation would cost hours.
          memory: 11G
          # 12 threads shared with creative (8), solo (6) and the media stack; a
          # chunky pregen without a cap sits at 670% next to Jellyfin.
          cpus: "8"
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  default:
    driver: bridge
